[project]
name = "tiktok-trip"
version = "0.1.0"
description = "Turn TikTok food reviews into a verified, direction-grouped trip plan"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
    "typer>=0.12",
    "httpx>=0.27",
    "tenacity>=8.3",
    "rapidfuzz>=3.9",
    "ortools>=9.10",
    "openpyxl>=3.1",
    "yt-dlp>=2025.1.1",
    "pillow>=10",
    "imagehash>=4.3",
    "python-dotenv>=1.0",
    "rich>=13",
    "playwright>=1.64.0",
]

[project.scripts]
tiktok-trip = "tiktok_trip.cli:app"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]
whisper = ["faster-whisper>=1.0"]

[tool.uv]
default-groups = ["dev", "whisper"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiktok_trip"]
artifacts = ["src/tiktok_trip/export/web_dist/**"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W", "RUF", "PL"]
ignore = ["PLR0913", "PLR2004", "PLC0415"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
